# ============================================================
# 分片构建 + Cloudflare Pages 部署（v2）
#
# 放在：.github/workflows/deploy-cloudflare.yml（覆盖旧版）
# 分支：v5
#
# 这一版解决两件事：
#   1) 构建不再超内存 —— 把 content/ 切成若干小片分别构建，再合并。
#      （旧版一次性解析 1GB 语料，解析阶段就涨到 8GB 被 V8 强杀，exit 134）
#   2) 不再每次全量 —— 每片带内容哈希，配合 GitHub 缓存，只重建改动过的片。
#
# 前置条件（只做一次）：
#   a) Cloudflare 项目 reits-quartz 已关闭自动构建（Branch control）
#   b) 仓库 Secrets 已有：
#        CLOUDFLARE_ACCOUNT_ID  你的 Account ID
#        CLOUDFLARE_API_TOKEN   具有 Cloudflare Pages:Edit 权限的令牌
# ============================================================

name: Build Quartz (sharded) and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - v5
    paths:
      - "content/**"
      - "quartz/**"
      - "scripts/**"
      - "quartz.config.default.yaml"
      - "quartz.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      # —— 分片参数（要调就改这几行）——
      SHARD_MB: "120"           # 每片目标体积；越小越省内存、片数越多
      SHARD_PARALLEL: "1"       # 串行构建。改成 2/3 可提速，但曾出现 esbuild 死锁，不建议
      SHARD_TIMEOUT_MIN: "30"   # 单片超时；卡住就强杀并报错，不会拖到 4 小时
      SHARD_HEAP_MB: "4096"     # 单片 Node 堆上限；到顶会报可读错误，而不是被系统静默杀掉

    steps:
      - name: 1. 拉取仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 2. 安装 Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: 3. 环境体检
        run: |
          echo "== 构建机资源 =="
          echo "CPU 核数: $(nproc)"
          free -h
          df -h / | tail -1

      - name: 4. 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 5. 生成插件索引与筛选页数据
        run: |
          npm run install-plugins
          node scripts/generate-filter-data.mjs

      - name: 6. 计算分片计划
        id: plan
        run: node scripts/shard-build.mjs --plan-only

      - name: 7. 恢复分片缓存（只重建改动过的片）
        uses: actions/cache@v6
        with:
          path: .shards-out
          key: quartz-shards-${{ steps.plan.outputs.plan_hash }}
          restore-keys: |
            quartz-shards-

      - name: 8. 分片构建并合并
        run: node scripts/shard-build.mjs

      - name: 9. 压缩超限索引
        if: always() && hashFiles('scripts/shrink-index.mjs') != ''
        run: node scripts/shrink-index.mjs

      - name: 10. 部署失败取证
        if: failure()
        run: |
          echo "== 内核 OOM 记录 =="
          sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process|oom-kill" | tail -20 || echo "（无）"
          echo ""
          echo "== 当前内存与磁盘 =="
          free -h; df -h /

      - name: 11. 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=reits-quartz --branch=v5 --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
